name: Publish Tagged APK Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-and-publish-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 0
          persist-credentials: false
          submodules: recursive

      - name: Set up Java
        uses: actions/setup-java@f2beeb24e141e01a676f977032f5a29d81c9e27e
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@f29f5a9d7b09a7c6b29859002d29d24e1674c884

      - name: Set up Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: ""

      - name: Install Android SDK packages
        shell: bash
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Derive release version
        id: version
        shell: bash
        run: |
          version_name="${GITHUB_REF_NAME#v}"
          IFS='.' read -r major minor patch <<< "$version_name"

          for part in "$major" "$minor" "$patch"; do
            if [[ ! "$part" =~ ^[0-9]+$ ]]; then
              echo "Tag must match v<major>.<minor>.<patch>; got ${GITHUB_REF_NAME}" >&2
              exit 1
            fi
          done

          version_code=$((major * 1000000 + minor * 1000 + patch))
          if (( version_code > 2100000000 )); then
            echo "Computed versionCode ${version_code} exceeds Android's limit" >&2
            exit 1
          fi

          echo "version_name=${version_name}" >> "$GITHUB_OUTPUT"
          echo "version_code=${version_code}" >> "$GITHUB_OUTPUT"

      - name: Decode release keystore
        shell: bash
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "${ANDROID_RELEASE_KEYSTORE_BASE64}" ]]; then
            echo "Missing ANDROID_RELEASE_KEYSTORE_BASE64 secret" >&2
            exit 1
          fi

          printf '%s' "${ANDROID_RELEASE_KEYSTORE_BASE64}" | base64 --decode > "${RUNNER_TEMP}/romulus-release.keystore"

      - name: Build signed release APK
        env:
          ROMULUS_SIGNING_STORE_FILE: ${{ runner.temp }}/romulus-release.keystore
          ROMULUS_SIGNING_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          ROMULUS_SIGNING_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          ROMULUS_SIGNING_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: >
          ./gradlew
          :app:testDebugUnitTest
          :app:lintDebug
          :app:assembleRelease
          --console=plain
          -PromulusVersionName=${{ steps.version.outputs.version_name }}
          -PromulusVersionCode=${{ steps.version.outputs.version_code }}

      - name: Assert signed release output
        shell: bash
        run: |
          release_apk="$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' | head -n 1)"

          if [[ -z "${release_apk}" ]]; then
            echo "No release APK was produced" >&2
            exit 1
          fi

          if [[ "${release_apk}" == *"-unsigned.apk" ]]; then
            echo "Release APK is unsigned; check signing secrets" >&2
            exit 1
          fi

          cp "${release_apk}" "romulus-${GITHUB_REF_NAME}.apk"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@6da8fa9354ddfdc4aeace5fc48d7f679b5214090
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: romulus-${{ github.ref_name }}.apk
          fail_on_unmatched_files: true
